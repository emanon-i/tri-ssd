schema_version: "1.1"
name: heldout-setup-dryrun
description: 移行の中身だけを見たいと言われたら、ドライランで計画を示し、ファイルを変えない
tags: [outcome, heldout, setup]
plugins: ["../.."]
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    新しい Tri-SSD の構成に移行したら何が変わるのか見たい。まだファイルは変えないで。
graders:
  - name: dry-run-shown
    type: tool_used
    tool: Bash
    input_match: 'migrate(?![^"]*--apply)'
  - name: not-applied
    type: tool_used
    tool: Bash
    input_match: 'migrate[^"]*--apply'
    min: 0
    max: 0
    arm: both
  - name: nothing-created
    type: file_exists
    path: docs/goal.md
    exists: false
  - name: plan-explained
    type: regex
    target: last_message
    pattern: 'goal\.md'
