schema_version: "1.1"
name: neg-question-in-tri-project
description: Tri-SSD プロジェクトの中でも、一般的なプログラミングの質問ではスキルを呼ばない
tags: [outcome, dev, trigger-negative]
plugins: ["../.."]
expected_outcome: スキルを呼ばず、質問に直接答える。
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Python で dict を値の降順に並べ替えるいちばん簡単な書き方を教えて。
graders:
  - name: no-tri-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:tri-ssd:)?tri-ssd-(?:setup|task|docs)"'
    min: 0
    max: 0
    arm: both
  - name: answered
    type: regex
    target: last_message
    pattern: 'sorted\('
