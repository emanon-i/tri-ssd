name: Tests

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"

      - name: Unit tests and long-run simulation
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Self-check (this repository's own Tri-SSD knowledge)
        run: python scripts/tri.py check
